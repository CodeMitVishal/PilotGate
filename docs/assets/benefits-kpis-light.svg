<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">What one PilotGate run gives you</title>
<desc id="d">Time for a full evidence run: 1.4 min (latest; 1.2 to 4.1 min over 8 full runs); Cost of one evidence run: $0.11 (28 scenarios, 7 checks, an AI judge); Defects stopped before users: 6 (plus 1 planted demo the gate caught); Invented figures caught by code: 93% (195 of 210 in a mutation test); Assistant cost per conversation: $0.0011 (about $6.64 a month at 6,000 lookups)</desc>
<rect width="1200" height="220" rx="12" fill="#fcfcfb"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">What one PilotGate run gives you</text>
<text x="32" y="70" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Measured in the gate runs in docs/evidence (runs 1 to 10)</text>
<rect x="32.0" y="92" width="214.4" height="104" rx="10" fill="#f4f3f0"/>
<text x="48.0" y="118" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Time for a full evidence run</text>
<text x="48.0" y="160" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="start">1.4 min</text>
<text x="48.0" y="184" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">latest; 1.2 to 4.1 min over 8 full runs</text>
<rect x="262.4" y="92" width="214.4" height="104" rx="10" fill="#f4f3f0"/>
<text x="278.4" y="118" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Cost of one evidence run</text>
<text x="278.4" y="160" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="start">$0.11</text>
<text x="278.4" y="184" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">28 scenarios, 7 checks, an AI judge</text>
<rect x="492.8" y="92" width="214.4" height="104" rx="10" fill="#f4f3f0"/>
<text x="508.8" y="118" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Defects stopped before users</text>
<text x="508.8" y="160" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="start">6</text>
<text x="508.8" y="184" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">plus 1 planted demo the gate caught</text>
<rect x="723.2" y="92" width="214.4" height="104" rx="10" fill="#f4f3f0"/>
<text x="739.2" y="118" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Invented figures caught by code</text>
<text x="739.2" y="160" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="start">93%</text>
<text x="739.2" y="184" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">195 of 210 in a mutation test</text>
<rect x="953.6" y="92" width="214.4" height="104" rx="10" fill="#f4f3f0"/>
<text x="969.6" y="118" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Assistant cost per conversation</text>
<text x="969.6" y="160" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="start">$0.0011</text>
<text x="969.6" y="184" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">about $6.64 a month at 6,000 lookups</text>
