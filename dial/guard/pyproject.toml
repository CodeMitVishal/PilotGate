[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dial-guard"
version = "1.0.0"
description = "Runtime interceptor for EPAM AI DIAL: quarantines untrusted input, guards streamed output, emits events"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "aidial-interceptors-sdk==0.9.0",
  "regex",
  "idna",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "jsonschema", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not e2e\""
markers = ["e2e: needs the docker compose stack (run with -m e2e)"]
filterwarnings = ["ignore::DeprecationWarning"]
