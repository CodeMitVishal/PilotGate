# Local DIAL stack: EPAM DIAL Core + Redis + DIAL Guard + a deterministic mock model.
# Only DIAL Core publishes a port, and only on 127.0.0.1: the guard and the applications are reachable from Core
# alone, so nobody can call them directly with a static key and skip the guard.
# Run ./setup.ps1 once (keys and encryption values, git-ignored), then: docker compose up -d --build --wait
name: dial-suite

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  redis:
    image: redis:7.2.4-alpine3.19@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lfu", "--save", "",
              "--appendonly", "no"]
    user: redis  # start unprivileged: the image's entrypoint then skips its chown step
    <<: *hardening
    tmpfs: ["/tmp", "/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    image: epam/ai-dial-core:0.50.8@sha256:2c5b3a7e2fa7b447a6e0d22dc98b2980f340d6cb5aa6c2fb4b99179b02810934
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${DIAL_CORE_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      AIDIAL_SETTINGS: /opt/settings/settings.json
      aidial.config.files: '["/opt/config/core-config.json"]'
      aidial.config.reload: "5000"
      aidial.redis.singleServerConfig.address: redis://redis:6379
      aidial.encryption.secret: ${DIAL_ENCRYPTION_SECRET:?run setup.ps1 first}
      aidial.encryption.key: ${DIAL_ENCRYPTION_KEY:?run setup.ps1 first}
    volumes:
      - ./config/core-settings.json:/opt/settings/settings.json:ro
      - ./config/core-config.json:/opt/config/core-config.json:ro
      - core-data:/app/data
      - core-logs:/app/log
    extra_hosts:
      - "host.docker.internal:host-gateway"  # ClaimsAssist runs on the host (it keeps its Entra sign-in there)
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "--tries=1", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20

  guard:
    build: ../guard
    image: pilotgate/dial-guard:1.0.0
    environment:
      DIAL_URL: http://core:8080
      DIAL_GUARD_EVENTS_FILE: /var/log/dial-guard/events.jsonl
    volumes:
      - ./data/events:/var/log/dial-guard
    <<: *hardening
    mem_limit: 384m

  mockmodel:
    build: ../mockmodel
    image: pilotgate/dial-mockmodel:1.0.0
    <<: *hardening
    mem_limit: 128m

volumes:
  core-data:
  core-logs:
